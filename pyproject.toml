[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuf"
version = "0.1.0"
description = "Neural Ultrasound Field training and reconstruction tools"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
neuf = "neuf.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuf*"]
